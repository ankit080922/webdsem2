<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Manipulation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f1f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.4s ease;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 450px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #333;
            font-size: 28px;
            transition: font-size 0.2s ease;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            background-color: #3b71ca;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2c5496;
        }

        #extra-content {
            margin-top: 15px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <h1 id="heading">Welcome to javascript</h1>
    
    <input type="text" id="headingInput" placeholder="Enter the new heading">

    <div class="button-container">
        <button onclick="changeHeading()">Change Heading</button>
        <button onclick="changeBackground()">Change Background</button>
        <button onclick="increaseFontSize()">Increase Font Size</button>
        <button onclick="toggleParagraph()">Show/Hide Paragraph</button>
        <button onclick="resetAll()">Reset</button>
    </div>

    <p id="extra-content" style="display:none;">This is a hidden paragraph toggled by JavaScript!</p>
</div>

<script>
    const heading = document.getElementById('heading');
    const input = document.getElementById('headingInput');
    const body = document.body;
    const content = document.getElementById('extra-content');
    
    let currentFontSize = 28;

    function changeHeading() {
        if (input.value.trim() !== "") {
            heading.innerText = input.value;
            input.value = "";
        } else {
            alert("Please type something in the box first!");
        }
    }

    function changeBackground() {
        // Generates a random light color
        const randomColor = `hsl(${Math.random() * 360}, 70%, 90%)`;
        body.style.backgroundColor = randomColor;
    }

    function increaseFontSize() {
        currentFontSize += 4;
        heading.style.fontSize = currentFontSize + "px";
    }

    function toggleParagraph() {
        if (content.style.display === "none") {
            content.style.display = "block";
        } else {
            content.style.display = "none";
        }
    }

    function resetAll() {
        heading.innerText = "Welcome to javascript";
        body.style.backgroundColor = "#f1f4f9";
        currentFontSize = 28;
        heading.style.fontSize = "28px";
        content.style.display = "none";
        input.value = "";
    }
</script>

</body>
</html>
