<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
       
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

       
        .container {
            background-color: #f8f8f8;
            border: 2px solid #000;
            padding: 30px;
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 20px;
        }

       
        .card {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Soft shadow */
            border: 1px solid #ddd;
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 20px;
        }

        .card p {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }

        .marks {
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Information</h2>

        <div class="card">
            <h3>Ankit kumar singh</h3>
            <p>Course: Computer Science</p>
            <p class="marks">Cgpa: 8.4</p>
        </div>

        <div class="card">
            <h3>Akshat tripathi</h3>
            <p>Course: Information Technology</p>
            <p class="marks">Cgpa: 8.9</p>
        </div>

        <div class="card">
            <h3>Dev chauhan</h3>
            <p>Course: Electronics</p>
            <p class="marks">Cgpa: 8.6</p>
        </div>

        <div class="card">
            <h3>Anant garg</h3>
            <p>Course: Electronics</p>
            <p class="marks">Cgpa: 8.7</p>
        </div>
    </div>

</body>
</html>
